[package]
name = "aw-sync-rust"
version = "0.1.0"
description = "ActivityWatch 局域网同步/设备发现/配对/冲突处理逻辑（独立隔离的同步网络功能）"
edition = "2021"

[lib]
name = "aw_sync_rust"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.30", features = ["chrono", "serde_json", "bundled"] }
uuid = { version = "1.3", features = ["serde", "v4"] }
rand = "0.8"
gethostname = "0.4"
libc = "0.2"
# rustls + webpki-roots：内置根证书，不依赖系统 CA 存储/openssl 交叉编译。
# 两端统一：Android 走 openssl 交叉编译不可靠（ef16c71 当年为此换的 rustls），
# 桌面 Windows 的 Schannel/native-tls 并无必要。
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-webpki-roots"] }
rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = "0.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"